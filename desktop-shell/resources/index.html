<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Trader</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #7c4f28;
    background-image:
      repeating-linear-gradient(90deg, rgba(30,15,4,.28) 0 2.5px, transparent 2.5px 118px),
      linear-gradient(180deg, #9c6e40, #7c4f28 55%, #5f3c1c);
    display: flex; align-items: center; justify-content: center;
    font-family: "Comic Sans MS", "Segoe Print", cursive;
  }
  .sheet {
    width: min(86%, 360px);
    background: #fffdf6;
    border: 1.5px solid #d9c9a6;
    border-radius: 10px;
    box-shadow: 0 14px 30px -14px rgba(30,15,4,.7);
    padding: 26px 24px 30px;
    transform: rotate(-1.2deg);
    color: #33291d;
    text-align: center;
    position: relative;
  }
  .sheet::before, .sheet::after {
    content: ""; position: absolute; top: -9px; width: 74px; height: 20px;
    background: rgba(255,246,222,.6); border: 1px solid rgba(180,160,110,.4);
  }
  .sheet::before { left: 18px; transform: rotate(-7deg); }
  .sheet::after { right: 18px; transform: rotate(5deg); }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .sub { color: #6f6558; font-size: 14px; margin-bottom: 18px; }
  .pen { font-size: 30px; animation: w 1.1s ease-in-out infinite alternate; }
  @keyframes w { from { transform: translateY(0) rotate(-8deg); } to { transform: translateY(-5px) rotate(6deg); } }
  a { color: #2456a6; }
  .foot { margin-top: 14px; font-size: 12px; color: #6f6558; }
</style>
</head>
<body>
  <div class="sheet">
    <h1>Paper Trader</h1>
    <div class="sub">walking to Moorthy's floor…</div>
    <div class="pen">✎</div>
    <div class="foot" id="note">connecting to the live exchange</div>
    <script>
      var LIVE = "https://paper-trader-h1ko.onrender.com/";
      var MIRROR = "https://hacvilke.github.io/paper-trader/";
      var t = setTimeout(function () {
        document.getElementById("note").innerHTML =
          'the floor is taking a while to wake (free servers nap).<br>' +
          '<a href="' + LIVE + '">retry live</a> · <a href="' + MIRROR + '">open the mirror</a>';
      }, 6000);
      location.replace(LIVE);
    </script>
  </div>
</body>
</html>
