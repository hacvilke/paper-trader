<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Trader</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #5f3c1c; }

  /* the waking sheet — on top until the game has actually painted */
  #veil {
    position: fixed; inset: 0; z-index: 10;
    background: #7c4f28;
    background-image:
      repeating-linear-gradient(90deg, rgba(30,15,4,.28) 0 2.5px, transparent 2.5px 118px),
      linear-gradient(180deg, #9c6e40, #7c4f28 55%, #5f3c1c);
    display: flex; align-items: center; justify-content: center;
    font-family: "Comic Sans MS", "Segoe Print", cursive;
    transition: opacity .45s ease;
  }
  #veil.gone { opacity: 0; pointer-events: none; }
  .sheet {
    width: min(86%, 360px);
    background: #fffdf6;
    border: 1.5px solid #d9c9a6;
    border-radius: 10px;
    box-shadow: 0 14px 30px -14px rgba(30,15,4,.7);
    padding: 26px 24px 26px;
    transform: rotate(-1.2deg);
    color: #33291d;
    text-align: center;
    position: relative;
  }
  .sheet::before, .sheet::after {
    content: ""; position: absolute; top: -9px; width: 74px; height: 20px;
    background: rgba(255,246,222,.6); border: 1px solid rgba(180,160,110,.4);
  }
  .sheet::before { left: 18px; transform: rotate(-7deg); }
  .sheet::after { right: 18px; transform: rotate(5deg); }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .sub { color: #6f6558; font-size: 14px; margin-bottom: 16px; }
  .pen { font-size: 30px; animation: w 1.1s ease-in-out infinite alternate; }
  @keyframes w { from { transform: translateY(0) rotate(-8deg); } to { transform: translateY(-5px) rotate(6deg); } }
  .foot { margin-top: 12px; font-size: 12.5px; color: #6f6558; line-height: 1.5; min-height: 19px; }
  button {
    font-family: inherit; font-size: 14px; cursor: pointer;
    background: #fffdf6; color: #33291d;
    border: 1.5px solid #b09b74; border-radius: 8px;
    padding: 7px 14px; margin: 4px 3px 0;
  }
  button.prime { background: #1e7a44; color: #fffdf6; border-color: #166034; }
</style>
</head>
<body>
  <iframe id="game" src="about:blank"></iframe>

  <div id="veil">
    <div class="sheet">
      <h1>Paper Trader</h1>
      <div class="sub">walking to Moorthy's floor…</div>
      <div class="pen" id="pen">✎</div>
      <div class="foot" id="note">connecting to the live exchange</div>
      <div id="acts"></div>
    </div>
  </div>

  <script>
    var LIVE = "https://paper-trader-h1ko.onrender.com/";
    var MIRROR = "https://hacvilke.github.io/paper-trader/";
    var frame = document.getElementById("game");
    var veil = document.getElementById("veil");
    var note = document.getElementById("note");
    var pen = document.getElementById("pen");
    var acts = document.getElementById("acts");
    var loaded = false, timers = [];

    function clearTimers() { while (timers.length) clearTimeout(timers.pop()); }

    function go(url, label) {
      clearTimers();
      loaded = false;
      note.textContent = label || "connecting to the live exchange…";
      acts.innerHTML = "";
      // status beats: the sheet NEVER goes away on its own — the game
      // fades in underneath when it has actually loaded
      timers.push(setTimeout(function () {
        if (loaded) return;
        note.innerHTML = "free servers nap — waking can take ~40s.";
        btn("try the mirror floor", function () { go(MIRROR); });
      }, 9000));
      timers.push(setTimeout(function () {
        if (loaded) return;
        note.innerHTML = "still waking… hang in there, or try the mirror.";
        btn("retry the live floor", function () { go(LIVE); });
        btn("try the mirror floor", function () { go(MIRROR); });
      }, 45000));
      // the iframe request itself is the wake-up knock
      frame.src = url + "?t=" + Date.now();
    }

    function btn(text, fn) {
      var b = document.createElement("button");
      b.textContent = text;
      b.onclick = fn;
      acts.appendChild(b);
    }

    frame.addEventListener("load", function () {
      if (frame.src === "about:blank") return;
      loaded = true;
      clearTimers();
      note.textContent = "the floor is open.";
      // small settle so the game's first paint lands before the fade
      timers.push(setTimeout(function () {
        veil.classList.add("gone");
        clearTimers();
      }, 450));
    });

    // paint the sheet first, then knock
    setTimeout(function () { go(LIVE); }, 350);
  </script>
</body>
</html>
